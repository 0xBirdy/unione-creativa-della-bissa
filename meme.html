<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archivio Bissa - Terminale Verde</title>

<style>
:root {
  --neon-green: #00ff41; /* Verde Matrix */
  --neon-glow: rgba(0, 255, 65, 0.4);
  --neon-purple: #ff00ff;
  --bg-dark: #050a05;
}

@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');

* { box-sizing: border-box; }

body {
  background: black;
  color: var(--neon-green);
  font-family: 'Fira Code', monospace;
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
  overflow-x: hidden;
}

/* Sfondo con Scanlines in movimento */
body::before {
  content: " ";
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 255, 0, 0.05) 50%),
              linear-gradient(90deg, rgba(0, 255, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
  background-size: 100% 4px, 3px 100%;
  z-index: 100;
  pointer-events: none;
}

/* Animazione di sfarfallio tipica dei monitor CRT */
@keyframes flicker {
  0% { opacity: 0.97; }
  5% { opacity: 0.95; }
  10% { opacity: 0.9; }
  15% { opacity: 0.95; }
  25% { opacity: 0.98; }
  30% { opacity: 0.94; }
  100% { opacity: 1; }
}

.card-container {
  width: 100%;
  max-width: 580px;
  animation: flicker 0.1s infinite;
}

.card {
  background: rgba(0, 15, 0, 0.95);
  border: 2px solid var(--neon-green);
  border-radius: 5px; /* Più squadrata per stile terminale */
  padding: 30px;
  box-shadow: 0 0 20px var(--neon-glow), inset 0 0 10px var(--neon-glow);
  position: relative;
  transition: all 0.5s ease;
}

/* Effetto Bissomane */
.card.bissomane {
  border-color: var(--neon-purple);
  box-shadow: 0 0 30px rgba(255, 0, 255, 0.6);
  color: var(--neon-purple);
}

.header {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid var(--neon-green);
  padding-bottom: 15px;
  margin-bottom: 20px;
}

.profile-section {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
}

.profile-img {
  width: 120px;
  height: 120px;
  border: 1px solid var(--neon-green);
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 0 10px var(--neon-glow);
}

.details { flex-grow: 1; }
.label { font-size: 0.7rem; opacity: 0.7; text-transform: uppercase; }
.value { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; display: block; }

.backstory {
  font-size: 0.85rem;
  line-height: 1.5;
  margin: 20px 0;
  padding: 15px;
  background: rgba(0, 255, 0, 0.03);
  border-left: 2px solid var(--neon-green);
}

.bonus-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  border: 1px dashed var(--neon-green);
  padding: 15px;
  font-size: 0.8rem;
}

.stat-bar {
  margin-top: 20px;
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  background: rgba(0, 255, 0, 0.1);
  padding: 5px 10px;
}

.qr-footer {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-top: 25px;
}

canvas#sigillo { width: 80px; height: 80px; }
img#qr { width: 80px; filter: grayscale(1) brightness(1.5) sepia(1) hue-rotate(80deg); }

.btn-group {
  margin-top: 30px;
  display: flex;
  gap: 15px;
}

button {
  background: transparent;
  border: 1px solid var(--neon-green);
  color: var(--neon-green);
  padding: 10px 20px;
  font-family: inherit;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: var(--neon-green);
  color: black;
  box-shadow: 0 0 20px var(--neon-green);
}

#status { height: 20px; margin-top: 15px; font-size: 0.8rem; color: #fff700; }
</style>
</head>
<body>

<h2 style="letter-spacing: 5px;">> ARCHIVIO_BISSA.EXE</h2>

<div class="card-container">
  <div class="card" id="card">
    <div class="header">
      <div>[SOGGETTO CLASSIFICATO]</div>
      <div id="id-code">#000000</div>
    </div>

    <div class="profile-section">
      <div class="profile-img" id="img-container">
         </div>
      <div class="details">
        <span class="label">NOME OPERATIVO</span>
        <span class="value" id="nome">...</span>
        <span class="label">RANGO</span>
        <span class="value" id="ruolo" style="text-shadow: 0 0 10px var(--neon-glow);">...</span>
      </div>
    </div>

    <div class="backstory" id="backstory"></div>

    <div class="bonus-grid">
      <div><span class="label">VIZIO:</span><br><span id="peccato"></span></div>
      <div><span class="label">CAVALIERE:</span><br><span id="cavaliere"></span></div>
      <div style="grid-column: span 2;"><span class="label">IL VERBO:</span><br><span id="verbo"></span></div>
    </div>

    <div class="stat-bar" id="stats"></div>

    <div class="qr-footer">
      <canvas id="sigillo" width="100" height="100"></canvas>
      <img id="qr">
    </div>
  </div>
</div>

<div id="status"></div>

<div class="btn-group">
  <button onclick="generate()">INIZIALIZZA ESTRAZIONE</button>
  <button onclick="download()">DUMP_PNG</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
const nomi = ["Fratello","Custode","Errante","Adepto","Testimone","Archivista"];
const essenze = ["Nebbia","Fumo","Cenere","Radice","Eco","Spirale"];
const titoli = ["della Bissa","del Faro","del Collasso","della Veglia"];
const backstories = [
  "Nato in un glitch temporale, ride del vuoto cosmico.",
  "Vaga tra i database corrotti in cerca della Bissa Suprema.",
  "Ex-osservatore del cerchio, ora portatore di caos.",
  "Custodisce il segreto dell'ottavo peccato: la noia."
];
const peccati = ["Superbia 👑", "Avarizia 💰", "Lussuria ❤️", "Invidia 🐍", "Gola 🍷", "Ira 🗡️", "Accidia ☁️"];
const cavalieri = ["Morte 💀", "Guerra ⚔️", "Carestia ⚖️", "Conquista 🏹"];

function r(a){ return a[Math.floor(Math.random()*a.length)]; }

function generate() {
  const isBissomane = Math.random() < 0.05;
  const seed = Math.random().toString(16).slice(2, 8).toUpperCase();
  
  // Immagine Casuale Astratta
  const profileSvg = `<svg width="120" height="120" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="black"/>
    <path d="M${r([10,20,30])} ${r([10,20,30])} L${r([70,80,90])} ${r([70,80,90])} M${r([10,90])} ${r([10,90])} L50 50" stroke="${isBissomane?'#ff00ff':'#00ff41'}" stroke-width="2" fill="none"/>
    <circle cx="50" cy="50" r="${r([10,20,30])}" stroke="${isBissomane?'#ff00ff':'#00ff41'}" fill="none" opacity="0.5"/>
  </svg>`;

  document.getElementById("card").className = "card " + (isBissomane ? "bissomane" : "");
  document.getElementById("img-container").innerHTML = profileSvg;
  document.getElementById("nome").textContent = `${r(nomi)} ${r(essenze)} ${r(titoli)}`;
  document.getElementById("ruolo").textContent = isBissomane ? "!!! IL BISSOMANE !!!" : r(["Osservatore", "Mediatore", "Agitatore"]);
  document.getElementById("id-code").textContent = "#" + seed;
  document.getElementById("backstory").textContent = r(backstories);
  document.getElementById("peccato").textContent = r(peccati);
  document.getElementById("cavaliere").textContent = r(cavalieri);
  document.getElementById("verbo").textContent = r(["Non annoiare mai", "Onora il silenzio", "La Bissa è la via"]);
  
  document.getElementById("stats").innerHTML = `
    <span>SAG: ${r([6,7,8,9,10])}</span> <span>ELO: ${r([6,7,8,9,10])}</span> 
    <span>IRO: ${r([6,7,8,9,10])}</span> <span>TOL: ${r([6,7,8,9,10])}</span>
  `;

  drawSigillo(seed, isBissomane);
  document.getElementById("qr").src = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=BISSA-${seed}&color=${isBissomane?'ff00ff':'00ff41'}&bgcolor=000000`;
}

function drawSigillo(seed, special) {
  const c = document.getElementById("sigillo"), ctx = c.getContext("2d");
  ctx.clearRect(0,0,100,100);
  ctx.strokeStyle = special ? "#ff00ff" : "#00ff41";
  for(let i=0; i<8; i++) {
    ctx.beginPath();
    ctx.arc(50, 50, 5 + i*5, 0, Math.PI * (i%2?1:2));
    ctx.stroke();
  }
}

function download() {
  html2canvas(document.getElementById("card"), {backgroundColor:'#000'}).then(canvas => {
    const a = document.createElement("a");
    a.href = canvas.toDataURL();
    a.download = "Bissa_Dump.png";
    a.click();
  });
}

generate();
</script>
</body>
</html>
