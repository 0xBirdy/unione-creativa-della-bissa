<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archivio Bissa - Terminale Smeraldo</title>

<style>
:root {
  --neon-green: #00ff41; 
  --neon-glow: rgba(0, 255, 65, 0.5);
  --bg-dark: #020502;
}

@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');

* { box-sizing: border-box; }

body {
  background-color: black;
  color: var(--neon-green);
  font-family: 'Fira Code', monospace;
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
  overflow-x: hidden;
}

/* Animazione di sfarfallio e scanlines per rendere la UI "viva" */
body::after {
  content: " ";
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 255, 65, 0.03) 50%);
  background-size: 100% 4px;
  z-index: 1000;
  pointer-events: none;
}

@keyframes pulse-border {
  0% { box-shadow: 0 0 15px var(--neon-glow); }
  100% { box-shadow: 0 0 35px var(--neon-glow), inset 0 0 15px var(--neon-glow); }
}

.card-container {
  width: 100%;
  max-width: 600px;
  margin-top: 20px;
}

.card {
  background: rgba(0, 10, 0, 0.9);
  border: 2px solid var(--neon-green);
  border-radius: 10px;
  padding: 30px;
  animation: pulse-border 2s infinite alternate;
  position: relative;
}

/* Header stile terminale */
.header {
  border-bottom: 1px solid var(--neon-green);
  padding-bottom: 10px;
  margin-bottom: 25px;
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  letter-spacing: 2px;
}

.profile-area {
  display: flex;
  gap: 25px;
  margin-bottom: 25px;
}

/* Avatar generato casualmente */
.avatar-box {
  width: 140px;
  height: 140px;
  border: 1px solid var(--neon-green);
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 0 10px var(--neon-glow);
}

.details { flex-grow: 1; }
.label { font-size: 0.7rem; opacity: 0.6; text-transform: uppercase; display: block; }
.value { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; display: block; color: #fff; text-shadow: 0 0 5px var(--neon-green); }

.backstory-box {
  background: rgba(0, 255, 65, 0.05);
  border: 1px dashed var(--neon-green);
  padding: 15px;
  margin-bottom: 20px;
  font-size: 0.85rem;
  line-height: 1.4;
}

.bonus-section {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 20px;
}

.stat-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  background: rgba(0, 255, 65, 0.1);
  padding: 10px;
  text-align: center;
  font-size: 0.75rem;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 25px;
}

canvas#sigillo { width: 90px; height: 90px; filter: drop-shadow(0 0 5px var(--neon-green)); }
img#qr { width: 90px; filter: invert(48%) sepia(79%) saturate(2476%) hue-rotate(86deg) brightness(118%) contrast(119%); }

.btn-group {
  margin-top: 30px;
  display: flex;
  gap: 15px;
}

button {
  background: transparent;
  border: 1px solid var(--neon-green);
  color: var(--neon-green);
  padding: 12px 25px;
  font-family: inherit;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
  text-transform: uppercase;
}

button:hover {
  background: var(--neon-green);
  color: black;
  box-shadow: 0 0 20px var(--neon-green);
}

#status { height: 20px; margin-top: 15px; font-size: 0.8rem; }
</style>
</head>
<body>

<h1 style="text-shadow: 0 0 20px var(--neon-green);">> ARCHIVIO_BISSA.EXE</h1>

<div class="card-container">
  <div class="card" id="card">
    <div class="header">
      <span>SYSTEM_ID: <span id="id-val">#0000</span></span>
      <span>STATUS: OPERATIVO</span>
    </div>

    <div class="profile-area">
      <div class="avatar-box" id="avatar-container"></div>
      <div class="details">
        <span class="label">Identità</span>
        <span class="value" id="nome-val">...</span>
        <span class="label">Ruolo Gerarchico</span>
        <span class="value" id="ruolo-val" style="color: var(--neon-green);">...</span>
      </div>
    </div>

    <div class="backstory-box" id="backstory-val"></div>

    <div class="bonus-section">
      <div><span class="label">Vizio:</span><br><span id="peccato-val"></span></div>
      <div><span class="label">Presagio:</span><br><span id="cavaliere-val"></span></div>
      <div style="grid-column: span 2;"><span class="label">Codice Condotta:</span><br><span id="verbo-val"></span></div>
    </div>

    <div class="stat-row" id="stats-val"></div>

    <div class="footer">
      <canvas id="sigillo" width="100" height="100"></canvas>
      <img id="qr">
    </div>
  </div>
</div>

<div id="status"></div>

<div class="btn-group">
  <button onclick="generate()">GENERA_PG</button>
  <button onclick="download()">ESPORTA_DATI</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
const nomi = ["Fratello","Custode","Errante","Adepto","Testimone","Archivista"];
const essenze = ["Nebbia","Fumo","Cenere","Radice","Eco","Spirale"];
const titoli = ["della Bissa","del Faro","del Collasso","della Veglia"];
const backstories = [
  "Nato in un glitch temporale, ride del vuoto cosmico mentre compila file corrotti.",
  "Un tempo serviva l'ordine, ora vaga cercando la frequenza della Bissa Suprema.",
  "Custode di segreti che farebbero impazzire un processore quantistico.",
  "Ha trasformato la propria noia in un'arma di distorsione della realtà."
];
const peccati = ["Superbia", "Avarizia", "Lussuria", "Invidia", "Gola", "Ira", "Accidia"];
const cavalieri = ["Morte", "Guerra", "Carestia", "Conquista"];

function r(a){ return a[Math.floor(Math.random()*a.length)]; }

function generate() {
  const isBissomane = Math.random() < 0.05;
  const seed = Math.random().toString(16).slice(2, 6).toUpperCase();
  
  // Immagine Casuale Astratta Verde
  const svg = `<svg width="140" height="140" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="black"/>
    <circle cx="50" cy="50" r="${r([15,25,35])}" stroke="#00ff41" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M${r([10,40])} ${r([10,40])} L${r([60,90])} ${r([60,90])} M10 90 L90 10" stroke="#00ff41" stroke-width="1"/>
    <text x="50" y="55" font-family="monospace" font-size="20" fill="#00ff41" text-anchor="middle" opacity="0.8">${isBissomane?'Ω':'Σ'}</text>
  </svg>`;

  document.getElementById("avatar-container").innerHTML = svg;
  document.getElementById("id-val").textContent = "#" + seed;
  document.getElementById("nome-val").textContent = `${r(nomi)} ${r(essenze)} ${r(titoli)}`;
  document.getElementById("ruolo-val").textContent = isBissomane ? "!!! IL BISSOMANE !!!" : r(["Osservatore", "Mediatore", "Agitatore"]);
  document.getElementById("backstory-val").textContent = `"${r(backstories)}"`;
  document.getElementById("peccato-val").textContent = r(peccati);
  document.getElementById("cavaliere-val").textContent = "Cavaliere della " + r(cavalieri);
  document.getElementById("verbo-val").textContent = r(["Non avrai altra Bissa", "Onora il silenzio", "Santifica la pausa"]);
  
  document.getElementById("stats-val").innerHTML = `
    <div>SAG:${r([6,7,8,9,10])}</div><div>ELO:${r([6,7,8,9,10])}</div>
    <div>IRO:${r([6,7,8,9,10])}</div><div>TOL:${r([6,7,8,9,10])}</div>
  `;

  drawSigillo(seed);
  document.getElementById("qr").src = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=BISSA-${seed}&color=00ff41&bgcolor=000000`;
}

function drawSigillo(seed) {
  const ctx = document.getElementById("sigillo").getContext("2d");
  ctx.clearRect(0,0,100,100); ctx.strokeStyle = "#00ff41";
  for(let i=0; i<8; i++) {
    ctx.beginPath(); ctx.arc(50, 50, 5 + i*5, 0, Math.PI * (i%2?1.2:2)); ctx.stroke();
  }
}

function download() {
  html2canvas(document.getElementById("card"), {backgroundColor: '#000'}).then(canvas => {
    const a = document.createElement("a");
    a.href = canvas.toDataURL();
    a.download = "Bissa_Log.png";
    a.click();
  });
}

generate();
</script>
</body>
</html>
