<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Tessera della Bissa - Special Edition</title>

<style>
body{
  background:radial-gradient(circle,#071207,#000);
  color:#9aff9a;
  font-family:monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:30px;
}

h1{ text-shadow:0 0 20px #0f0; text-align:center; }

.card{
  width:420px;
  padding:20px;
  border-radius:18px;
  background:linear-gradient(160deg,#020,#010);
  border:2px solid #0f0;
  box-shadow:0 0 30px rgba(0,255,0,.5);
  position:relative;
  overflow:hidden;
}

/* Effetto speciale per il Bissomane */
.card.bissomane { border:2px solid #ff00ff; box-shadow:0 0 40px #ff00ff; }

.row{ margin:6px 0; }
.bonus-section { color: #fff700; font-size: 0.9em; border: 1px dashed #fff700; padding: 5px; margin-top: 10px; }

hr{
  border:0;
  height:1px;
  background:linear-gradient(to right,transparent,#0f0,transparent);
  margin:12px 0;
}

canvas, img{ display:block; margin:10px auto; }

button{
  margin:14px 5px;
  padding:10px 20px;
  background:#020;
  border:2px solid #0f0;
  color:#0f0;
  border-radius:10px;
  cursor:pointer;
}
button:hover{ background:#0f0; color:#000; }
#slot{ opacity:.7; font-style:italic; height:20px; margin-bottom: 10px; }
</style>
</head>

<body>

<h1>🎴 Tessera Ufficiale della Bissa <br><small style="font-size: 0.5em; color: #0f0;">V2.0 - Apocalisse & Peccato</small></h1>

<div class="card" id="card">
  <canvas id="sigillo" width="160" height="160"></canvas>
  <div id="info"></div>
  <div id="slot"></div>
  <img id="qr">
</div>

<div class="controls">
    <button onclick="startGeneration()">🎲 Genera Tessera</button>
    <button onclick="downloadPNG()">⬇️ Scarica PNG</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
// ───────────────── DATA ─────────────────
const nomi = ["Fratello","Custode","Errante","Adepto","Testimone","Archivista"];
const essenze = ["Nebbia","Fumo","Cenere","Radice","Eco","Spirale"];
const titoli = ["della Bissa","del Faro","del Collasso","della Veglia"];
const ruoliBase = ["Osservatore","Agitatore","Mediatore","Custode del Cerchio","Riflessivo"];

// --- NUOVI DATASET ---
const peccati = ["Superbia", "Avarizia", "Lussuria", "Invidia", "Gola", "Ira", "Accidia"];
const comandamenti = [
    "I: Non avrai altra Bissa all'infuori di me", "II: Non nominare il nome della Bissa invano",
    "III: Ricordati di santificare le pause", "IV: Onora il silenzio e la parola",
    "V: Non uccidere l'entusiasmo", "VI: Non commettere atti impuri di noia",
    "VII: Non rubare l'attenzione", "VIII: Non dire falsa testimonianza nel cerchio",
    "IX: Non desiderare la bissa d'altri", "X: Non desiderare la roba d'altri"
];
const cavalieri = ["Morte 💀", "Guerra ⚔️", "Carestia ⚖️", "Conquista 🏹"];

const rarita = [
 {nome:"Comune",mod:0,prob:40},
 {nome:"Non Comune",mod:1,prob:30},
 {nome:"Rara",mod:2,prob:15},
 {nome:"Epica",mod:4,prob:10},
 {nome:"Leggendaria",mod:6,prob:4},
 {nome:"TRASCENDENTE",mod:10,prob:1} // Per il Bissomane
];

const backstories = [
"Ha visto la fine del mondo e ha deciso che era il momento giusto per un'ultima bissa.",
"Portatore di un vizio capitale, lo usa per comprendere le debolezze altrui.",
"Segue i 10 comandamenti della Bissa con un fervore quasi religioso.",
"Un tempo era un uomo normale, ora vaga come spettro del Bissomane.",
"Predica l'apocalisse tra una risata e l'altra."
];

// ───────────────── UTILS ─────────────────
function r(a){ return a[Math.floor(Math.random()*a.length)]; }

function rollRarity(){
 let roll=Math.random()*100, sum=0;
 for(const rar of rarita){ sum+=rar.prob; if(roll<=sum) return rar; }
}

function stat(base){ return Math.min(10,Math.max(1,base+Math.floor(Math.random()*5)-2)); }

// ───────────────── GENERATION ─────────────────
function startGeneration(){
 let i=0;
 const slot=document.getElementById("slot");
 const t=setInterval(()=>{
   slot.textContent="Invocando potenze arcane... "+r(peccati)+"…";
   if(++i>15){ clearInterval(t); generate(); }
 },70);
}

function generate(){
 const seed=crypto.getRandomValues(new Uint32Array(1))[0].toString(16);
 const rar=rollRarity();
 const mod=rar.mod;
 
 // Logica Bissomane (1% di probabilità se Trascendente)
 let ruoloScelto = r(ruoliBase);
 let extraStyle = "";
 if(rar.nome === "TRASCENDENTE") {
     ruoloScelto = "🌀 IL BISSOMANE";
     extraStyle = "bissomane";
 }

 const data={
   nome:`${r(nomi)} ${r(essenze)} ${r(titoli)}`,
   ruolo: ruoloScelto,
   rarita: rar.nome,
   extraStyle: extraStyle,
   backstory: r(backstories),
   peccato: r(peccati),
   comandamento: r(comandamenti),
   cavaliere: r(cavalieri),
   stats:{
     saggezza:stat(5+mod),
     eloquenza:stat(5+mod),
     resistenza:stat(5+mod),
     ironia:stat(5+mod),
     tolleranza:stat(5+mod)
   },
   sigillo:seed,
   data:new Date().toLocaleDateString()
 };

 localStorage.setItem("tesseraBissa",JSON.stringify(data));
 render(data);
 drawSigillo(seed);
 drawQR(seed);
}

// ───────────────── RENDER ─────────────────
function render(t){
 const card = document.getElementById("card");
 card.className = "card " + (t.extraStyle || "");
 
 document.getElementById("info").innerHTML=`
 <div class="row"><b>Nome:</b> ${t.nome}</div>
 <div class="row"><b>Ruolo:</b> <span style="color:${t.extraStyle?'#ff00ff':'#0f0'}">${t.ruolo}</span></div>
 <div class="row"><b>Rarità:</b> ${t.rarita}</div>

 <hr>

 <div class="bonus-section">
    <b>✦ Bonus Divini & Oscuri ✦</b><br>
    Vizio: ${t.peccato}<br>
    Verbo: ${t.comandamento}<br>
    Presagio: Cavaliere della ${t.cavaliere}
 </div>

 <hr>

 <div class="row"><b>Statistiche</b></div>
 Saggezza 🌿: ${t.stats.saggezza} | Eloquenza 💬: ${t.stats.eloquenza}<br>
 Resistenza 🍂: ${t.stats.resistenza} | Ironia 😏: ${t.stats.ironia}<br>
 Tolleranza 🍃: ${t.stats.tolleranza}

 <hr>
 <div class="row" style="font-size:0.8em; opacity:0.8 italic;">"${t.backstory}"</div>
 <hr>

 <div class="row"><b>Sigillo:</b> #${t.sigillo}</div>
 <div class="row"><b>Emessa:</b> ${t.data}</div>
 `;
}

// ───────────────── SIGILLO ─────────────────
function drawSigillo(seed){
 const c=document.getElementById("sigillo");
 const x=c.getContext("2d");
 x.clearRect(0,0,160,160);
 for(let i=0;i<10;i++){
   x.strokeStyle= i > 7 ? "#ff00ff" : `hsl(${(parseInt(seed,16)+i*35)%360},100%,50%)`;
   x.lineWidth = 2;
   x.beginPath();
   x.arc(80,80,10+i*7,0,Math.PI*(i%2?2:1.5));
   x.stroke();
 }
}

// ───────────────── QR ─────────────────
function drawQR(seed){
 document.getElementById("qr").src=
 `https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=BISSA://${seed}&color=0f0&bgcolor=020`;
}

// ───────────────── PNG ─────────────────
function downloadPNG(){
 html2canvas(document.getElementById("card")).then(c=>{
   const a=document.createElement("a");
   a.href=c.toDataURL();
   a.download="tessera_bissa_bonus.png";
   a.click();
 });
}

// ───────────────── LOAD ─────────────────
const saved=localStorage.getItem("tesseraBissa");
if(saved){
 const t=JSON.parse(saved);
 render(t); drawSigillo(t.sigillo); drawQR(t.sigillo);
}
</script>

</body>
</html>
