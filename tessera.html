<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tessera della Bissa V2 - Apocalypse</title>

<style>
:root {
  --neon-green: #0f0;
  --neon-glow: rgba(0, 255, 0, 0.4);
  --bg-dark: #050a05;
  --card-bg: rgba(0, 20, 0, 0.9);
}

* { box-sizing: border-box; }

body {
  background: radial-gradient(circle at center, #0a1a0a 0%, #000 100%);
  color: #9aff9a;
  font-family: 'Courier New', Courier, monospace;
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

h1 {
  text-transform: uppercase;
  letter-spacing: 3px;
  text-shadow: 0 0 15px var(--neon-green);
  text-align: center;
  margin-bottom: 5px;
  font-size: 1.8rem;
}

.subtitle {
  font-size: 0.8rem;
  color: var(--neon-green);
  opacity: 0.7;
  margin-bottom: 20px;
}

/* CONTAINER TESSERA ADATTIVO */
.card-container {
  width: 100%;
  max-width: 500px; /* Più grande su desktop */
  perspective: 1000px;
}

.card {
  background: var(--card-bg);
  border: 2px solid var(--neon-green);
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 0 25px var(--neon-glow), inset 0 0 15px rgba(0,255,0,0.1);
  position: relative;
  transition: all 0.5s ease;
}

/* EFFETTO BISSOMANE */
.card.bissomane {
  border-color: #ff00ff;
  box-shadow: 0 0 40px rgba(255, 0, 255, 0.6);
  background: linear-gradient(145deg, #1a001a, #050005);
}
.bissomane #role-text { color: #ff00ff; text-shadow: 0 0 10px #ff00ff; font-weight: bold; }

.sigillo-box {
  width: 100%;
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
}

canvas {
  max-width: 180px;
  height: auto;
  filter: drop-shadow(0 0 10px var(--neon-green));
}

.info-grid {
  display: grid;
  gap: 12px;
  font-size: 1rem;
}

.row-label { color: var(--neon-green); font-weight: bold; font-size: 0.85rem; text-transform: uppercase; }
.row-value { color: #fff; font-size: 1.1rem; }

.bonus-box {
  background: rgba(255, 255, 0, 0.05);
  border: 1px dashed #fff700;
  padding: 15px;
  margin: 15px 0;
  border-radius: 10px;
  font-size: 0.9rem;
}

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  background: rgba(0,0,0,0.3);
  padding: 10px;
  border-radius: 8px;
}

.stat-item { font-size: 0.85rem; border-bottom: 1px solid rgba(0,255,0,0.1); padding: 2px 0; }

hr {
  border: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
  margin: 20px 0;
}

.qr-box { text-align: center; margin-top: 15px; }
#qr { width: 100px; border: 1px solid var(--neon-green); padding: 5px; background: #000; }

.btn-group {
  margin-top: 25px;
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  justify-content: center;
}

button {
  background: transparent;
  border: 1px solid var(--neon-green);
  color: var(--neon-green);
  padding: 12px 25px;
  font-family: inherit;
  cursor: pointer;
  border-radius: 5px;
  transition: 0.3s;
  text-transform: uppercase;
  font-weight: bold;
}

button:hover {
  background: var(--neon-green);
  color: #000;
  box-shadow: 0 0 20px var(--neon-green);
}

#status-log {
  margin-top: 10px;
  font-size: 0.8rem;
  height: 20px;
  color: #fff700;
}

@media (max-width: 480px) {
  .card { padding: 15px; }
  .stats-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<h1>🎴 Tessera Bissa</h1>
<div class="subtitle">Protocollo: Peccati, Comandamenti e Apocalisse</div>

<div class="card-container">
  <div class="card" id="card">
    <div class="sigillo-box">
      <canvas id="sigillo" width="200" height="200"></canvas>
    </div>

    <div class="info-grid" id="main-info">
      </div>

    <div id="status-log"></div>

    <div class="qr-box">
      <img id="qr">
    </div>
  </div>
</div>

<div class="btn-group">
  <button onclick="startGeneration()">🎲 Genera Nuova</button>
  <button onclick="downloadPNG()">💾 Salva PNG</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
// --- DATASET ESTESI ---
const nomi = ["Fratello","Custode","Errante","Adepto","Testimone","Archivista"];
const essenze = ["Nebbia","Fumo","Cenere","Radice","Eco","Spirale"];
const titoli = ["della Bissa","del Faro","del Collasso","della Veglia"];
const ruoliBase = ["Osservatore","Agitatore","Mediatore","Custode","Riflessivo"];

const peccati = ["Superbia 👑", "Avarizia 💰", "Lussuria ❤️", "Invidia 🐍", "Gola 🍷", "Ira 🗡️", "Accidia ☁️"];
const comandamenti = [
  "Non avrai altra Bissa all'infuori di me",
  "Ricordati di santificare le pause",
  "Non uccidere l'entusiasmo",
  "Non rubare l'attenzione",
  "Onora il silenzio e la parola"
];
const cavalieri = ["Morte 💀", "Guerra ⚔️", "Carestia ⚖️", "Conquista 🏹"];

const rarita = [
 {n:"Comune", m:0, p:40}, {n:"Non Comune", m:1, p:30},
 {n:"Rara", m:2, p:15}, {n:"Epica", m:4, p:9},
 {n:"Leggendaria", m:6, p:5}, {n:"TRASCENDENTE", m:10, p:1}
];

function r(a){ return a[Math.floor(Math.random()*a.length)]; }

function startGeneration() {
  const log = document.getElementById("status-log");
  let i = 0;
  const interval = setInterval(() => {
    log.textContent = "Sincronizzando con il piano astrale... " + r(peccati);
    if(i++ > 12) { clearInterval(interval); log.textContent = ""; generate(); }
  }, 80);
}

function generate() {
  const seed = Math.random().toString(16).slice(2, 10);
  let roll = Math.random() * 100, sum = 0, rar = rarita[0];
  for(let x of rarita){ sum += x.p; if(roll <= sum){ rar = x; break; } }

  const isBissomane = rar.n === "TRASCENDENTE";
  const data = {
    id: seed,
    nome: `${r(nomi)} ${r(essenze)} ${r(titoli)}`,
    ruolo: isBissomane ? "🌀 IL BISSOMANE" : r(ruoliBase),
    rar: rar.n,
    style: isBissomane ? "bissomane" : "",
    peccato: r(peccati),
    comandamento: r(comandamenti),
    cavaliere: r(cavalieri),
    stats: {
      sagg: 5 + rar.m + Math.floor(Math.random()*3),
      eloq: 5 + rar.m + Math.floor(Math.random()*3),
      iron: 5 + rar.m + Math.floor(Math.random()*3),
      toll: 5 + rar.m + Math.floor(Math.random()*3)
    },
    data: new Date().toLocaleDateString('it-IT')
  };

  render(data);
  drawSigillo(seed, isBissomane);
  document.getElementById("qr").src = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=BISSA-${seed}&color=0f0&bgcolor=000`;
}

function render(t) {
  const card = document.getElementById("card");
  card.className = "card " + t.style;
  
  document.getElementById("main-info").innerHTML = `
    <div><span class="row-label">Identità</span><br><span class="row-value">${t.nome}</span></div>
    <div><span class="row-label">Rango</span><br><span class="row-value" id="role-text">${t.ruolo} (${t.rar})</span></div>
    
    <div class="bonus-box">
      <div style="color:#fff700; margin-bottom:5px; font-weight:bold;">💠 ATTRIBUTI DIVINI</div>
      • Peccato: ${t.peccato}<br>
      • Verbo: ${t.comandamento}<br>
      • Presagio: ${t.cavaliere}
    </div>

    <div class="stats-grid">
      <div class="stat-item">Saggezza: ${t.stats.sagg}</div>
      <div class="stat-item">Eloquenza: ${t.stats.eloq}</div>
      <div class="stat-item">Ironia: ${t.stats.iron}</div>
      <div class="stat-item">Tolleranza: ${t.stats.toll}</div>
    </div>

    <div style="font-size:0.7rem; opacity:0.5; margin-top:10px;">
      Codice: #${t.id} | Data: ${t.data}
    </div>
  `;
}

function drawSigillo(seed, special) {
  const canvas = document.getElementById("sigillo");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,200,200);
  const color = special ? "#ff00ff" : "#0f0";
  
  for(let i=0; i<12; i++) {
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.8 - (i*0.05);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(100, 100, 10 + i*7, 0, Math.PI * (i%2 ? 2 : 1.5));
    ctx.stroke();
  }
}

function downloadPNG() {
  html2canvas(document.getElementById("card"), { backgroundColor: null }).then(canvas => {
    const link = document.createElement("a");
    link.download = "tessera-bissa.png";
    link.href = canvas.toDataURL();
    link.click();
  });
}

// Inizializza
generate();
</script>

</body>
</html>
