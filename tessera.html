<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tessera Ufficiale della Bissa</title>

<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --green:#00ff41;
  --glow:0 0 25px rgba(0,255,65,.6);
  --bg:#020402;
}

*{box-sizing:border-box}
body{
  background:black;
  color:var(--green);
  font-family:'Fira Code',monospace;
  margin:0;
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

h1{
  text-shadow:var(--glow);
  margin-bottom:20px;
}

.card{
  width:100%;
  max-width:680px;
  border:2px solid var(--green);
  padding:25px;
  background:rgba(0,15,0,.9);
  box-shadow:var(--glow);
  position:relative;
}

.header{
  display:flex;
  justify-content:space-between;
  font-size:.75rem;
  border-bottom:1px solid var(--green);
  padding-bottom:8px;
  margin-bottom:15px;
  flex-wrap:wrap;
  gap:10px;
}

.profile{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.avatar{
  width:140px;
  height:140px;
  border:1px solid var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.info{flex:1;min-width:200px;}

.value{
  font-size:1.2rem;
  font-weight:bold;
  color:#fff;
  margin-bottom:6px;
}

.label{
  font-size:.7rem;
  opacity:.7;
}

.box{
  border:1px dashed var(--green);
  padding:12px;
  margin-top:15px;
  font-size:.8rem;
  line-height:1.6;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:15px;
  font-size:.8rem;
}

@media (max-width: 500px) {
  .grid {
    grid-template-columns: 1fr;
  }
  .grid > div[style*="span 2"] {
    grid-column: span 1 !important;
  }
}

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  margin-top:15px;
  text-align:center;
  font-size:.7rem;
}

@media (max-width: 400px) {
  .stats {
    grid-template-columns: repeat(3, 1fr);
  }
}

.stat{
  background:rgba(0,255,65,.08);
  padding:6px;
}

.footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:20px;
  flex-wrap:wrap;
  gap:15px;
}

canvas{filter:drop-shadow(var(--glow))}
img{
  width:90px;
  height:90px;
}

.btn-container{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
}

button{
  margin-top:20px;
  background:transparent;
  border:1px solid var(--green);
  color:var(--green);
  padding:10px 20px;
  font-family:inherit;
  font-weight:bold;
  cursor:pointer;
  transition: all 0.15s ease;
}

button:hover{
  background:var(--green);
  color:black;
  box-shadow:var(--glow);
  transform:scale(1.05);
}

button:active{
  transform:scale(0.98);
}

button:disabled{
  opacity:0.5;
  cursor:not-allowed;
}

.warning{
  color:#39ff14;
  text-shadow:0 0 10px #39ff14;
}

.error-msg{
  color:#ff0000;
  text-shadow:0 0 10px #ff0000;
  font-size:0.8rem;
  margin-top:10px;
  display:none;
}
</style>
</head>

<body>

<h1>> ARCHIVIO_BISSA</h1>

<div class="card" id="card">
  <div class="header">
    <span>ID: <span id="id"></span></span>
    <span id="status">OPERATIVO</span>
  </div>

  <div class="profile">
    <div class="avatar" id="avatar" role="img" aria-label="Avatar del personaggio"></div>
    <div class="info">
      <div class="label">Identità</div>
      <div class="value" id="nome"></div>
      <div class="label">Classe</div>
      <div class="value" id="ruolo"></div>
      <div class="label">Rarità</div>
      <div class="value" id="rarita"></div>
    </div>
  </div>

  <div class="box" id="dossier"></div>

  <div class="grid">
    <div><b>Peccato:</b> <span id="peccato"></span></div>
    <div><b>Cavaliere:</b> <span id="cavaliere"></span></div>
    <div style="grid-column:span 2"><b>Comandamento:</b> <span id="verbo"></span></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="footer">
    <canvas id="sigillo" width="100" height="100" aria-label="Sigillo identificativo"></canvas>
    <img id="qr" alt="QR Code identificativo" loading="lazy">
  </div>
</div>

<div class="btn-container">
  <button onclick="generate()">GENERA NUOVO PG</button>
  <button onclick="download()" id="downloadBtn">ESPORTA PNG</button>
</div>
<div class="error-msg" id="errorMsg"></div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
const nomi=["Fratello","Errante","Custode","Archivista","Testimone","Vegliatore"];
const essenze=["Fumo","Nebbia","Cenere","Eco","Radice","Spirale","Vuoto","Nodo"];
const titoli=["della Bissa","del Faro","del Collasso","della Veglia","del Rallentamento"];

const origini=[
"Infrastruttura collassata",
"Forum dimenticato",
"Zona grigia algoritmica",
"Militanza ironica",
"Errore di sistema",
"Archivio mai chiuso"
];

const eventi=[
"Blackout comunicativo",
"Moderazione totale",
"Silenzio imposto",
"Meme proibito",
"Reset di identità",
"Fuga dal feed"
];

const visioni=[
"Lentezza come atto politico",
"Il fumo chiarisce",
"Nessuna opinione è urgente",
"Il caos va osservato",
"Ridurre è resistere",
"Il meme è verità compressa"
];

const peccati=["Superbia","Avarizia","Lussuria","Invidia","Gola","Ira","Accidia"];
const cavalieri=["Morte","Guerra","Carestia","Conquista"];
const comandamenti=[
"Non accelerare",
"Non urlare",
"Non convincere",
"Non salvare tutto",
"Onora il silenzio",
"Santifica la pausa",
"Lascia decadere",
"Non reagire subito",
"Non spiegare tutto",
"Sii ambiguo"
];

function r(a){return a[Math.floor(Math.random()*a.length)]}

function showError(msg){
  const errorEl = document.getElementById("errorMsg");
  errorEl.textContent = msg;
  errorEl.style.display = "block";
  setTimeout(() => {
    errorEl.style.display = "none";
  }, 5000);
}

function generate(){
  const seed=Math.random().toString(16).slice(2,8).toUpperCase();
  const bissomane=Math.random()<0.06;

  document.getElementById("id").textContent=seed;
  document.getElementById("nome").textContent=`${r(nomi)} ${r(essenze)} ${r(titoli)}`;
  document.getElementById("ruolo").textContent=bissomane?"BISSOMANE":"Osservatore Laterale";
  document.getElementById("rarita").textContent=bissomane?"0.6%":"Comune";

  document.getElementById("status").textContent=bissomane?"!!! ANOMALIA !!!":"OPERATIVO";
  document.getElementById("status").className=bissomane?"warning":"";

  document.getElementById("dossier").innerHTML=
  `<b>ORIGINE:</b> ${r(origini)}<br>
   <b>EVENTO:</b> ${r(eventi)}<br>
   <b>VISIONE:</b> ${r(visioni)}<br>
   <b>ESITO:</b> Influenza senza esposizione`;

  document.getElementById("peccato").textContent=r(peccati);
  document.getElementById("cavaliere").textContent=r(cavalieri);
  document.getElementById("verbo").textContent=r(comandamenti);

  const stats = ['SAG','ELO','RES','IRO','TOL'].map(s => 
    `<div class="stat">${s}<br>${6+Math.floor(Math.random()*5)}</div>`
  ).join('');
  document.getElementById("stats").innerHTML = stats;

  drawSigillo(seed);
  
  // QR Code con gestione errori
  const qrImg = document.getElementById("qr");
  qrImg.onerror = function() {
    console.warn("Errore caricamento QR code");
    this.style.display = "none";
  };
  qrImg.onload = function() {
    this.style.display = "block";
  };
  qrImg.src=`https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=BISSA-${seed}&color=00ff41&bgcolor=000000`;

  // Avatar SVG migliorato
  const symbol = bissomane ? "&#937;" : "&#931;"; // Omega e Sigma come entity HTML
  document.getElementById("avatar").innerHTML=
  `<svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
    <rect width="120" height="120" fill="black"/>
    <circle cx="60" cy="60" r="${20+Math.random()*30}" stroke="#00ff41" fill="none" stroke-width="2"/>
    <text x="60" y="68" font-size="22" fill="#00ff41" text-anchor="middle" font-family="monospace">${symbol}</text>
   </svg>`;
}

function drawSigillo(seed){
  const canvas = document.getElementById("sigillo");
  const c = canvas.getContext("2d");
  c.clearRect(0,0,100,100);
  c.strokeStyle="#00ff41";
  c.lineWidth = 1.5;
  
  // Sigillo basato sul seed per renderlo unico
  const seedNum = parseInt(seed, 16);
  for(let i=0;i<6;i++){
    c.beginPath();
    const angle = (seedNum % 360) * Math.PI / 180;
    c.arc(50,50,10+i*8, angle, angle + Math.PI*(i%2?1.2:2));
    c.stroke();
  }
}

function download(){
  const btn = document.getElementById("downloadBtn");
  
  // Verifica se html2canvas è disponibile
  if (typeof html2canvas === 'undefined') {
    showError("Errore: libreria di esportazione non caricata. Riprova.");
    return;
  }
  
  btn.disabled = true;
  btn.textContent = "ESPORTAZIONE...";
  
  html2canvas(document.getElementById("card"),{
    backgroundColor:"#000",
    scale: 2,
    logging: false
  }).then(canvas => {
    try {
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = `BISSA_${document.getElementById("id").textContent}.png`;
      a.click();
    } catch(e) {
      showError("Errore durante l'esportazione: " + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "ESPORTA PNG";
    }
  }).catch(err => {
    showError("Errore durante la creazione dell'immagine");
    console.error(err);
    btn.disabled = false;
    btn.textContent = "ESPORTA PNG";
  });
}

// Genera il primo personaggio al caricamento
generate();
</script>

</body>
</html>
