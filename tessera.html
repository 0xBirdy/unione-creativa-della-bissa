<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tessera della Bissa V2.1 - Backstory Edition</title>

<style>
:root {
  --neon-green: #0f0;
  --neon-glow: rgba(0, 255, 0, 0.4);
  --bg-dark: #050a05;
}

* { box-sizing: border-box; }

body {
  background: radial-gradient(circle at center, #0a1a0a 0%, #000 100%);
  color: #9aff9a;
  font-family: 'Courier New', Courier, monospace;
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

h1 {
  text-transform: uppercase;
  letter-spacing: 3px;
  text-shadow: 0 0 15px var(--neon-green);
  margin-bottom: 20px;
  text-align: center;
}

.card-container {
  width: 100%;
  max-width: 550px; 
}

.card {
  background: linear-gradient(160deg, rgba(0,20,0,0.95) 0%, rgba(0,5,0,1) 100%);
  border: 2px solid var(--neon-green);
  border-radius: 20px;
  padding: 35px;
  box-shadow: 0 0 30px var(--neon-glow);
  position: relative;
  overflow: hidden;
}

/* Filigrana Scanline */
.card::before {
  content: " ";
  position: absolute;
  top: 0; left: 0; bottom: 0; right: 0;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 255, 0, 0.05) 50%), 
              linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
  background-size: 100% 4px, 3px 100%;
  pointer-events: none;
}

.card.bissomane {
  border-color: #ff00ff;
  box-shadow: 0 0 40px rgba(255, 0, 255, 0.5);
}

.sigillo-box { text-align: center; margin-bottom: 15px; }
canvas { max-width: 160px; filter: drop-shadow(0 0 8px var(--neon-green)); }

.info-grid { display: grid; gap: 15px; }
.row-label { color: var(--neon-green); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
.row-value { color: #fff; font-size: 1.2rem; font-weight: bold; }

.bonus-box {
  background: rgba(255, 255, 0, 0.03);
  border: 1px solid rgba(255, 247, 0, 0.3);
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
  font-size: 0.85rem;
}

.backstory-text {
  font-style: italic;
  font-size: 0.9rem;
  color: #ccc;
  line-height: 1.4;
  border-left: 3px solid var(--neon-green);
  padding-left: 15px;
  margin: 15px 0;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  background: rgba(0,255,0,0.05);
  padding: 12px;
  border-radius: 8px;
}

.stat-item { font-size: 0.8rem; }

.qr-box { text-align: right; margin-top: 20px; opacity: 0.8; }
#qr { width: 80px; border: 1px solid var(--neon-green); padding: 3px; background: #000; }

.btn-group { margin-top: 30px; display: flex; gap: 20px; }
button {
  background: #020;
  border: 1px solid var(--neon-green);
  color: var(--neon-green);
  padding: 12px 24px;
  cursor: pointer;
  border-radius: 8px;
  font-family: inherit;
  font-weight: bold;
  transition: 0.3s;
}
button:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 15px var(--neon-green); }

@media (max-width: 480px) {
  .stats-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<h1>🎴 Archivio Bissa</h1>

<div class="card-container">
  <div class="card" id="card">
    <div class="sigillo-box">
      <canvas id="sigillo" width="200" height="200"></canvas>
    </div>

    <div class="info-grid" id="content">
      </div>

    <div class="qr-box">
      <img id="qr">
    </div>
  </div>
</div>

<div class="btn-group">
  <button onclick="generate()">🎲 Nuova Estrazione</button>
  <button onclick="downloadPNG()">💾 Scarica PNG</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
const nomi = ["Fratello","Custode","Errante","Adepto","Testimone","Archivista"];
const essenze = ["Nebbia","Fumo","Cenere","Radice","Eco","Spirale"];
const titoli = ["della Bissa","del Faro","del Collasso","della Veglia"];
const ruoliBase = ["Osservatore","Agitatore","Mediatore","Custode Silente","Riflessivo"];

const backstories = [
  "Nato durante una discussione degenerata in risata collettiva, ha imparato che l’ironia è l’unico scudo contro il vuoto.",
  "Un tempo serviva l'ordine, ora vaga tra le rovine del buonsenso cercando la Bissa perfetta.",
  "Ha visto i Grandi Antichi annoiarsi a morte e ha deciso di non fare la stessa fine.",
  "Custodisce un segreto che solo i Bissomani possono comprendere: il silenzio è una risposta.",
  "Ex archivista del Collasso, ora scrive la sua storia sulle pareti della realtà."
];

const peccati = ["Superbia 👑", "Avarizia 💰", "Lussuria ❤️", "Invidia 🐍", "Gola 🍷", "Ira 🗡️", "Accidia ☁️"];
const comandamenti = ["I: Non avrai altra Bissa", "II: Onora il silenzio", "III: Santifica la pausa", "IV: Non annoiare", "V: Rispetta il cerchio"];
const cavalieri = ["Morte 💀", "Guerra ⚔️", "Carestia ⚖️", "Conquista 🏹"];

function r(a){ return a[Math.floor(Math.random()*a.length)]; }

function generate() {
  const isBissomane = Math.random() < 0.05; // 5% chance per test, riduci a 0.01 se vuoi 1%
  const seed = Math.random().toString(16).slice(2, 10);
  
  const data = {
    nome: `${r(nomi)} ${r(essenze)} ${r(titoli)}`,
    ruolo: isBissomane ? "🌀 IL BISSOMANE" : r(ruoliBase),
    style: isBissomane ? "bissomane" : "",
    backstory: r(backstories),
    peccato: r(peccati),
    cmd: r(comandamenti),
    cav: r(cavalieri),
    stats: { s: 5+Math.floor(Math.random()*6), e: 5+Math.floor(Math.random()*6), i: 5+Math.floor(Math.random()*6), t: 5+Math.floor(Math.random()*6) },
    id: seed
  };

  const card = document.getElementById("card");
  card.className = "card " + data.style;

  document.getElementById("content").innerHTML = `
    <div><span class="row-label">Soggetto</span><br><span class="row-value">${data.nome}</span></div>
    <div><span class="row-label">Rango Operativo</span><br><span class="row-value" style="color:${isBissomane?'#ff00ff':'#0f0'}">${data.ruolo}</span></div>
    
    <div class="backstory-text">"${data.backstory}"</div>

    <div class="bonus-box">
      <b>[PARAMETRI METAFISICI]</b><br>
      • Vizio: ${data.peccato}<br>
      • Verbo: ${data.cmd}<br>
      • Presagio: ${data.cav}
    </div>

    <div class="stats-grid">
      <div class="stat-item">Saggezza: ${data.stats.s}</div>
      <div class="stat-item">Eloquenza: ${data.stats.e}</div>
      <div class="stat-item">Ironia: ${data.stats.i}</div>
      <div class="stat-item">Tolleranza: ${data.stats.t}</div>
    </div>
  `;

  drawSigillo(seed, isBissomane);
  document.getElementById("qr").src = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=BISSA-${seed}&color=${isBissomane?'ff00ff':'00ff00'}&bgcolor=000000`;
}

function drawSigillo(seed, special) {
  const canvas = document.getElementById("sigillo");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,200,200);
  ctx.strokeStyle = special ? "#ff00ff" : "#0f0";
  ctx.lineWidth = 2;
  for(let i=0; i<10; i++) {
    ctx.beginPath();
    ctx.arc(100, 100, 10 + i*8, 0, Math.PI * (i%3==0 ? 1.5 : 2));
    ctx.stroke();
  }
}

function downloadPNG() {
  html2canvas(document.getElementById("card"), {backgroundColor:null, scale:2}).then(canvas => {
    const a = document.createElement("a");
    a.href = canvas.toDataURL();
    a.download = "tessera_bissa.png";
    a.click();
  });
}

generate();
</script>
</body>
</html>
