<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Tessera della Bissa</title>

<style>
body{
  background:radial-gradient(circle at top,#0b130b,#000);
  color:#9aff9a;
  font-family: monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:30px;
}

h1{ text-shadow:0 0 15px #0f0; }

.card{
  width:380px;
  padding:20px;
  border-radius:18px;
  background:linear-gradient(145deg,#020,#010);
  border:2px solid #0f0;
  box-shadow:0 0 30px rgba(0,255,0,.6);
}

canvas{ display:block; margin:12px auto; }

.row{ margin:6px 0; }

button{
  margin-top:14px;
  padding:10px 18px;
  background:#020;
  border:2px solid #0f0;
  color:#0f0;
  border-radius:8px;
  cursor:pointer;
}
button:hover{ background:#0f0; color:#000; }

#slot{ font-style:italic; opacity:.7; height:18px; }

img{ display:block; margin:10px auto; }
</style>
</head>

<body>

<h1>🎴 Tessera Ufficiale della Bissa</h1>

<div class="card" id="card">
  <canvas id="sigillo" width="160" height="160"></canvas>
  <div id="info"></div>
  <div id="slot"></div>
  <img id="qr" />
</div>

<button onclick="startGeneration()">🎲 Genera Tessera</button>
<button onclick="downloadPNG()">⬇️ Scarica PNG</button>

<script>
// DATA
const nomi=["Fratello","Custode","Errante","Adepto"];
const essenze=["Nebbia","Fumo","Cenere","Radice","Eco"];
const titoli=["della Bissa","del Collasso","del Faro"];
const ruoli=["Osservatore","Archivista","Guardiano","Agitatore"];
const tratti=[
  "incline alla riflessione lenta",
  "ironico sotto pressione",
  "ostinato nel dialogo",
  "lucido nel caos",
  "mutevole ma coerente"
];
const ambienti=[
  "ambienti saturi di discussione",
  "luoghi densi di fumo",
  "cerchi informali",
  "situazioni di collasso leggero"
];

function r(a){ return a[Math.floor(Math.random()*a.length)]; }

// SLOT ANIMATION
function startGeneration(){
  let i=0;
  const slot=document.getElementById("slot");
  const t=setInterval(()=>{
    slot.textContent=`Invocazione: ${r(nomi)} ${r(essenze)}...`;
    i++;
    if(i>12){ clearInterval(t); generate(); }
  },80);
}

function generate(){
  const seed=crypto.getRandomValues(new Uint32Array(1))[0].toString(16);

  const data={
    nome:`${r(nomi)} ${r(essenze)} ${r(titoli)}`,
    ruolo:r(ruoli),
    descrizione:`Soggetto ${r(tratti)}, attivo in ${r(ambienti)}.`,
    sigillo:seed,
    data:new Date().toLocaleDateString()
  };

  localStorage.setItem("tesseraBissa",JSON.stringify(data));
  render(data);
  drawSigillo(seed);
  drawQR(seed);
}

function render(t){
  document.getElementById("info").innerHTML=`
    <div class="row"><b>Nome:</b> ${t.nome}</div>
    <div class="row"><b>Ruolo:</b> ${t.ruolo}</div>
    <div class="row"><b>Descrizione:</b><br>${t.descrizione}</div>
    <div class="row"><b>Sigillo:</b> #${t.sigillo}</div>
    <div class="row"><b>Emessa:</b> ${t.data}</div>
  `;
}

// SIGILLO
function drawSigillo(seed){
  const c=document.getElementById("sigillo");
  const x=c.getContext("2d");
  x.clearRect(0,0,160,160);
  for(let i=0;i<10;i++){
    x.strokeStyle=`hsl(${(parseInt(seed,16)+i*40)%360},100%,50%)`;
    x.beginPath();
    x.arc(80,80,20+i*5,0,Math.PI*(i%2?2:1));
    x.stroke();
  }
}

// QR
function drawQR(seed){
  const data=`BISSA://sigillo=${seed}`;
  document.getElementById("qr").src=
    `https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(data)}`;
}

// DOWNLOAD
function downloadPNG(){
  html2canvas(document.getElementById("card")).then(c=>{
    const a=document.createElement("a");
    a.href=c.toDataURL();
    a.download="tessera_bissa.png";
    a.click();
  });
}

// LOAD
const saved=localStorage.getItem("tesseraBissa");
if(saved){
  const t=JSON.parse(saved);
  render(t); drawSigillo(t.sigillo); drawQR(t.sigillo);
}
</script>

<!-- lib per download PNG -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

</body>
</html>
