<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tessera Ufficiale della Bissa</title>

<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --green:#00ff41;
  --glow:0 0 25px rgba(0,255,65,.6);
  --bg:#020402;
}

*{box-sizing:border-box}
body{
  background:black;
  color:var(--green);
  font-family:'Fira Code',monospace;
  margin:0;
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

h1{
  text-shadow:var(--glow);
  margin-bottom:20px;
}

.card{
  width:100%;
  max-width:680px;
  border:2px solid var(--green);
  padding:25px;
  background:rgba(0,15,0,.9);
  box-shadow:var(--glow);
  position:relative;
}

.header{
  display:flex;
  justify-content:space-between;
  font-size:.75rem;
  border-bottom:1px solid var(--green);
  padding-bottom:8px;
  margin-bottom:15px;
  flex-wrap:wrap;
  gap:10px;
}

.profile{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.avatar{
  width:140px;
  height:140px;
  border:1px solid var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.info{flex:1;min-width:200px;}

.value{
  font-size:1.2rem;
  font-weight:bold;
  color:#fff;
  margin-bottom:6px;
}

.label{
  font-size:.7rem;
  opacity:.7;
}

.box{
  border:1px dashed var(--green);
  padding:12px;
  margin-top:15px;
  font-size:.8rem;
  line-height:1.6;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:15px;
  font-size:.8rem;
}

@media (max-width: 500px) {
  .grid {
    grid-template-columns: 1fr;
  }
  .grid > div[style*="span 2"] {
    grid-column: span 1 !important;
  }
}

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  margin-top:15px;
  text-align:center;
  font-size:.7rem;
}

@media (max-width: 400px) {
  .stats {
    grid-template-columns: repeat(3, 1fr);
  }
}

.stat{
  background:rgba(0,255,65,.08);
  padding:6px;
}

.footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:20px;
  flex-wrap:wrap;
  gap:15px;
}

canvas{filter:drop-shadow(var(--glow))}
img{
  width:90px;
  height:90px;
}

.btn-container{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
}

button{
  margin-top:20px;
  background:transparent;
  border:1px solid var(--green);
  color:var(--green);
  padding:10px 20px;
  font-family:inherit;
  font-weight:bold;
  cursor:pointer;
  transition: all 0.15s ease;
}

button:hover{
  background:var(--green);
  color:black;
  box-shadow:var(--glow);
  transform:scale(1.05);
}

button:active{
  transform:scale(0.98);
}

button:disabled{
  opacity:0.5;
  cursor:not-allowed;
}

.warning{
  color:#39ff14;
  text-shadow:0 0 10px #39ff14;
}

.error-msg{
  color:#ff0000;
  text-shadow:0 0 10px #ff0000;
  font-size:0.8rem;
  margin-top:10px;
  display:none;
}
</style>
</head>

function drawSigillo(seed){
  const canvas = document.getElementById("sigillo");
  const c = canvas.getContext("2d");
  c.clearRect(0,0,100,100);
  c.strokeStyle="#00ff41";
  c.lineWidth = 1.5;
  
  // Sigillo basato sul seed per renderlo unico
  const seedNum = parseInt(seed, 16);
  for(let i=0;i<6;i++){
    c.beginPath();
    const angle = (seedNum % 360) * Math.PI / 180;
    c.arc(50,50,10+i*8, angle, angle + Math.PI*(i%2?1.2:2));
    c.stroke();
  }
}

async function download(){
  const btn = document.getElementById("downloadBtn");
  
  // Verifica se html2canvas è disponibile
  if (typeof html2canvas === 'undefined') {
    showError("Errore: libreria di esportazione non caricata. Riprova.");
    return;
  }
  
  btn.disabled = true;
  btn.textContent = "ESPORTAZIONE...";
  
  try {
    // Salva i canvas originali
    const sigilloCanvas = document.getElementById("sigillo");
    const sigilloData = sigilloCanvas.toDataURL();
    
    // Sostituisci temporaneamente i canvas con immagini
    const sigilloImg = document.createElement("img");
    sigilloImg.src = sigilloData;
    sigilloImg.width = 100;
    sigilloImg.height = 100;
    sigilloImg.style.filter = "drop-shadow(0 0 25px rgba(0,255,65,.6))";
    sigilloCanvas.style.display = "none";
    sigilloCanvas.parentNode.insertBefore(sigilloImg, sigilloCanvas);
    
    // Aspetta che le immagini si carichino
    await new Promise(resolve => setTimeout(resolve, 100));
    
    // Cattura con html2canvas
    const canvas = await html2canvas(document.getElementById("card"),{
      backgroundColor:"#000",
      scale: 2,
      logging: false,
      useCORS: true,
      allowTaint: false
    });
    
    // Ripristina i canvas
    sigilloCanvas.style.display = "block";
    sigilloImg.remove();
    
    // Scarica
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = `BISSA_${document.getElementById("id").textContent}.png`;
    a.click();
    
  } catch(e) {
    showError("Errore durante l'esportazione: " + e.message);
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.textContent = "ESPORTA PNG";
  }
}

// Genera il primo personaggio al caricamento
